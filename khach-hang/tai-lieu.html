<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài liệu — Khách hàng | PM STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<a class="skip-link" href="#main-content">Bỏ qua, đi tới nội dung chính</a>

<div class="app">
  <aside class="app__sidebar">
    <a href="../index.html" class="app__brand"><span class="nav__brand-mark">PM</span> STUDIO</a>
    <p class="app__role">Khách hàng</p>

    <nav class="app__nav" aria-label="Điều hướng khách hàng">
      <a href="index.html" class="app__nav-link"><span class="app__nav-icon">◆</span> Tổng quan</a>
      <a href="du-an.html" class="app__nav-link"><span class="app__nav-icon">01</span> Dự án</a>
      <a href="tai-lieu.html" class="app__nav-link" aria-current="page"><span class="app__nav-icon">02</span> Tài liệu</a>
      <a href="tien-do.html" class="app__nav-link"><span class="app__nav-icon">03</span> Tiến độ</a>
      <a href="chinh-sua.html" class="app__nav-link"><span class="app__nav-icon">04</span> Chỉnh sửa</a>
      <a href="thanh-toan.html" class="app__nav-link"><span class="app__nav-icon">05</span> Thanh toán</a>
    </nav>

    <div class="app__sidebar-foot">
      <span class="app__signout"><span id="sidebar-customer-name">Đang tải...</span> · <a href="../dang-nhap.html" class="app__signout">Đăng xuất</a></span>
    </div>
  </aside>

  <main id="main-content" class="app__main">
    <div class="app__topbar">
      <div>
        <h1 class="app__title">Tài liệu &amp; nội dung</h1>
        <p class="app__subtitle">Tải lên ảnh, thực đơn và tài liệu cần thiết để đội thiết kế hoàn thiện website.</p>
      </div>
      <button type="button" class="btn btn--primary" id="upload-trigger-btn" disabled>Tải tài liệu lên</button>
      <input
        type="file"
        id="file-upload-input"
        class="visually-hidden"
        multiple
        accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip"
      >
    </div>

    <div class="panel">
      <div class="panel__head">
        <h2>Tài liệu đã tải lên</h2>
        <span id="quota-summary" style="color:var(--muted); font-family:var(--mono); font-size:.76rem;"></span>
      </div>

      <div class="file-list" id="uploaded-file-list">
        <p style="color:var(--text-soft);">Đang tải dữ liệu...</p>
      </div>
    </div>
  </main>
</div>

<script src="../api.js"></script>
<script src="../ui.js"></script>
<script src="../auth-guard.js" data-role="khach_hang" data-login-path="../dang-nhap.html"></script>
<script src="tai-lieu.js"></script>
</body>
</html>
